name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  testbench-list:
    runs-on: ubuntu-latest
    outputs:
      groups: ${{ steps.list.outputs.groups }}
    steps:
      - uses: actions/checkout@v7
      - name: Split testbenches into groups
        id: list
        run: |
          groups=$(ls tb/*_tb.sv | sed 's#.*/##;s#_tb\.sv$##' | grep -vE '^(coremark_boot|coremark_predict|embench_boot|freertos_boot|gate_check)$' | python3 -c "import sys, json; n=[l.strip() for l in sys.stdin if l.strip()]; g=[[] for _ in range(4)]; [g[i % 4].append(x) for i, x in enumerate(n)]; print(json.dumps([' '.join(x) for x in g if x]))")
          echo "groups=$groups" >> "$GITHUB_OUTPUT"

  testbenches:
    needs: testbench-list
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        group: ${{ fromJSON(needs.testbench-list.outputs.groups) }}
    steps:
      - uses: actions/checkout@v7
      - name: Install Icarus Verilog
        run: |
          sudo grep -rlZ packages.microsoft.com /etc/apt/sources.list.d/ 2>/dev/null | sudo xargs -0 -r rm -f
          sudo apt-get update
          sudo apt-get install -y iverilog
      - name: Run the testbench group
        run: |
          for mod in ${{ matrix.group }}; do
            echo "== $mod =="
            make MOD="$mod"
          done

  formal-list:
    runs-on: ubuntu-latest
    outputs:
      groups: ${{ steps.list.outputs.groups }}
    steps:
      - uses: actions/checkout@v7
      - name: Split formal tasks into groups
        id: list
        run: |
          groups=$(python3 - <<'PY'
          import glob, json, os, re
          items = []
          for f in sorted(glob.glob('formal/*.sby')):
              mod = os.path.basename(f)[:-4]
              block = re.search(r'^\[tasks\]\s*\n(.*?)(?=^\[|\Z)', open(f).read(), re.S | re.M)
              tasks = [l.split()[0] for l in block.group(1).splitlines()
                       if l.strip() and not l.lstrip().startswith('#')] if block else ['']
              items += ['%s:%s' % (mod, t) for t in tasks]
          n = min(len(items), 16)
          g = [[] for _ in range(n)]
          for i, x in enumerate(items):
              g[i % n].append(x)
          print(json.dumps([' '.join(x) for x in g if x]))
          PY
          )
          echo "$groups"
          echo "groups=$groups" >> "$GITHUB_OUTPUT"

  formal:
    needs: formal-list
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        group: ${{ fromJSON(needs.formal-list.outputs.groups) }}
    steps:
      - uses: actions/checkout@v7
      - uses: YosysHQ/setup-oss-cad-suite@v4
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Install sv2v
        run: |
          mkdir -p "$HOME/.local/bin"
          curl -sL -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" https://github.com/zachjs/sv2v/releases/download/v0.0.13/sv2v-Linux.zip -o sv2v.zip
          unzip -j sv2v.zip -d "$HOME/.local/bin"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Prove the group
        run: |
          for item in ${{ matrix.group }}; do
            mod=${item%%:*}
            task=${item#*:}
            echo "== $mod $task =="
            make formal MOD="$mod" TASK="$task"
          done

  core-formal-list:
    runs-on: ubuntu-latest
    outputs:
      groups: ${{ steps.list.outputs.groups }}
    steps:
      - uses: actions/checkout@v7
      - name: Install sv2v
        run: |
          mkdir -p "$HOME/.local/bin"
          curl -sL -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" https://github.com/zachjs/sv2v/releases/download/v0.0.13/sv2v-Linux.zip -o sv2v.zip
          unzip -j sv2v.zip -d "$HOME/.local/bin"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Clone riscv-formal
        run: |
          git clone https://github.com/YosysHQ/riscv-formal.git
          git -C riscv-formal checkout 2bd7410
      - name: Split checks into groups
        id: list
        env:
          RISCV_FORMAL_DIR: ${{ github.workspace }}/riscv-formal
        run: |
          groups=$(bash formal/rvfi/run.sh --list | python3 -c "import sys, json; n=[l.strip() for l in sys.stdin if l.strip()]; g=[[] for _ in range(8)]; [g[i % 8].append(x) for i, x in enumerate(n)]; print(json.dumps([' '.join(x) for x in g if x]))")
          echo "groups=$groups" >> "$GITHUB_OUTPUT"

  core-formal:
    needs: core-formal-list
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        group: ${{ fromJSON(needs.core-formal-list.outputs.groups) }}
    steps:
      - uses: actions/checkout@v7
      - uses: YosysHQ/setup-oss-cad-suite@v4
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Install sv2v
        run: |
          mkdir -p "$HOME/.local/bin"
          curl -sL -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" https://github.com/zachjs/sv2v/releases/download/v0.0.13/sv2v-Linux.zip -o sv2v.zip
          unzip -j sv2v.zip -d "$HOME/.local/bin"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Clone riscv-formal
        run: |
          git clone https://github.com/YosysHQ/riscv-formal.git
          git -C riscv-formal checkout 2bd7410
      - name: Prove the group
        env:
          RISCV_FORMAL_DIR: ${{ github.workspace }}/riscv-formal
        run: bash formal/rvfi/run.sh ${{ matrix.group }}

  coremark:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install Verilator and RISC-V toolchain
        run: |
          sudo grep -rlZ packages.microsoft.com /etc/apt/sources.list.d/ 2>/dev/null | sudo xargs -0 -r rm -f
          sudo apt-get update
          sudo apt-get install -y verilator gcc-riscv64-unknown-elf binutils-riscv64-unknown-elf
      - name: Alias toolchain to riscv64-elf-*
        run: |
          for t in gcc objcopy; do
            sudo ln -sf "$(command -v riscv64-unknown-elf-$t)" /usr/local/bin/riscv64-elf-$t
          done
      - name: Build CoreMark image
        run: make -C sw/coremark all
      - name: Boot CoreMark through the caches
        run: make vsim MOD=coremark_boot

  embench:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install Verilator and RISC-V toolchain
        run: |
          sudo grep -rlZ packages.microsoft.com /etc/apt/sources.list.d/ 2>/dev/null | sudo xargs -0 -r rm -f
          sudo apt-get update
          sudo apt-get install -y verilator gcc-riscv64-unknown-elf binutils-riscv64-unknown-elf
      - name: Alias toolchain to riscv64-elf-*
        run: |
          for t in gcc objcopy; do
            sudo ln -sf "$(command -v riscv64-unknown-elf-$t)" /usr/local/bin/riscv64-elf-$t
          done
      - name: Build the Embench images
        run: make -C sw/embench all
      - name: Boot the crc32 benchmark
        run: make vsim MOD=embench_boot PLUSARGS=+HEX=sw/embench/crc32.hex

  freertos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install Verilator and RISC-V toolchain
        run: |
          sudo grep -rlZ packages.microsoft.com /etc/apt/sources.list.d/ 2>/dev/null | sudo xargs -0 -r rm -f
          sudo apt-get update
          sudo apt-get install -y verilator gcc-riscv64-unknown-elf binutils-riscv64-unknown-elf
      - name: Alias toolchain to riscv64-elf-*
        run: |
          for t in gcc objcopy; do
            sudo ln -sf "$(command -v riscv64-unknown-elf-$t)" /usr/local/bin/riscv64-elf-$t
          done
      - name: Clone FreeRTOS-Kernel
        run: |
          git clone https://github.com/FreeRTOS/FreeRTOS-Kernel.git sw/FreeRTOS-Kernel
          git -C sw/FreeRTOS-Kernel checkout 9db704cd3bbe4963f9bd3de1f1161ea2cf90768b
      - name: Build FreeRTOS demo image
        run: make -C sw/freertos all
      - name: Run FreeRTOS queue demo testbench
        run: make vsim MOD=freertos_boot

  cosim:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install Icarus Verilog and RISC-V toolchain
        run: |
          sudo grep -rlZ packages.microsoft.com /etc/apt/sources.list.d/ 2>/dev/null | sudo xargs -0 -r rm -f
          sudo apt-get update
          sudo apt-get install -y iverilog gcc-riscv64-unknown-elf binutils-riscv64-unknown-elf device-tree-compiler libfdt-dev
      - name: Alias toolchain to riscv64-elf-*
        run: |
          for t in gcc objcopy; do
            sudo ln -sf "$(command -v riscv64-unknown-elf-$t)" /usr/local/bin/riscv64-elf-$t
          done
      - name: Cache Spike
        id: spike-cache
        uses: actions/cache@v6
        with:
          path: /opt/spike
          key: spike-riscv-isa-sim-v1
      - name: Build Spike
        if: steps.spike-cache.outputs.cache-hit != 'true'
        run: |
          git clone --depth 1 https://github.com/riscv-software-src/riscv-isa-sim.git
          cd riscv-isa-sim && mkdir build && cd build
          ../configure --prefix=/opt/spike
          make -j"$(nproc)"
          make install
      - name: Add Spike to environment
        run: |
          echo "/opt/spike/bin" >> "$GITHUB_PATH"
          echo "LD_LIBRARY_PATH=/opt/spike/lib" >> "$GITHUB_ENV"
      - name: Directed rv32im co-sim
        run: python3 tests/cosim.py cosim_m
      - name: Randomized co-sim regression (500 programs)
        run: python3 tests/cosim.py --rand 500

  gate-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: YosysHQ/setup-oss-cad-suite@v4
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Install sv2v and RISC-V toolchain
        run: |
          mkdir -p "$HOME/.local/bin"
          curl -sL -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" https://github.com/zachjs/sv2v/releases/download/v0.0.13/sv2v-Linux.zip -o sv2v.zip
          unzip -j sv2v.zip -d "$HOME/.local/bin"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          sudo grep -rlZ packages.microsoft.com /etc/apt/sources.list.d/ 2>/dev/null | sudo xargs -0 -r rm -f
          sudo apt-get update
          sudo apt-get install -y gcc-riscv64-unknown-elf binutils-riscv64-unknown-elf
      - name: Alias toolchain to riscv64-elf-*
        run: |
          for t in gcc objcopy; do
            sudo ln -sf "$(command -v riscv64-unknown-elf-$t)" /usr/local/bin/riscv64-elf-$t
          done
      - name: Prove the pc_plus4 keep holds
        run: bash gate_check.sh

  ci-gate:
    if: always()
    needs: [testbench-list, testbenches, formal-list, formal, core-formal-list, core-formal, coremark, embench, freertos, cosim, gate-check]
    runs-on: ubuntu-latest
    steps:
      - name: Verify all CI jobs succeeded
        if: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped') }}
        run: |
          echo "One or more required CI jobs did not succeed."
          exit 1
